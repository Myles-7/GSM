name: Bug report
description: Report a reproducible issue in the personal edition
title: "[Bug] "
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include the personal version or commit, OS, and desktop/development entry point.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Remove tokens, keys, cookies, account details, and private repository content before uploading logs or screenshots.
