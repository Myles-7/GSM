name: Build Desktop App

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-release-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify tagged release version
        if: github.ref_type == 'tag'
        run: node scripts/check-release-version.cjs "$GITHUB_REF_NAME"

  build:
    needs: verify-release-version
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Linux packaging tool
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Configure optional macOS signing
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$CSC_LINK_SECRET" ]; then
            {
              echo "CSC_LINK<<__EOF__"
              echo "$CSC_LINK_SECRET"
              echo "__EOF__"
              echo "CSC_KEY_PASSWORD<<__EOF__"
              echo "$CSC_KEY_PASSWORD_SECRET"
              echo "__EOF__"
            } >> "$GITHUB_ENV"
          fi
      - name: Compile frontend and package desktop
        run: npm run build:desktop
      - name: Ensure packaging did not rewrite source or lockfiles
        run: git diff --exit-code
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.rpm
          if-no-files-found: error

  release:
    needs: [verify-release-version, build]
    # Personal-edition pushes never publish inherited upstream installers.
    # A failed platform build must block a release rather than publish a partial one.
    if: github.repository == 'AmintaCCCP/GithubStarsManager' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
